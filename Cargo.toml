[package]
name = "keyword_extraction_pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Deterministic tier-1 keyword and identifier extraction for heterogeneous document corpora"
repository = "https://github.com/JOSHMT0744/keyword_extraction_pipeline"

[dependencies]
blake3 = "1"
calamine = "0.34"
lingua = { version = "1", default-features = false, features = ["english", "french", "german", "spanish", "italian", "dutch", "portuguese"] }
mail-parser = "0.11"
pdf_oxide = "=0.3.78"
quick-xml = "0.42"
unicode-normalization = "0.1"
unicode-segmentation = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"

[dev-dependencies]
blake3 = "1"
serde_json = "1"

[profile.release]
opt-level = 3
