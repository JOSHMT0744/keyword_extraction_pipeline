[package]
name = "keyword_extraction_pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Deterministic tier-1 keyword and identifier extraction for heterogeneous document corpora"
repository = "https://github.com/JOSHMT0744/keyword_extraction_pipeline"
documentation = "https://docs.rs/keyword_extraction_pipeline"
readme = "README.md"
keywords = ["keyword-extraction", "nlp", "yake", "deterministic", "text-mining"]
categories = ["text-processing", "science"]
# Input documents and working notes. `corpus/` holds real customer files, so it must never
# reach a published package; the rest is session material a consumer has no use for.
# `tests/fixtures/` and `scripts/` deliberately stay in, so a published crate can run its
# own suite and its resources can be regenerated rather than trusted.
exclude = ["corpus/", ".planning/", "TODO.md", "keywords.*"]

[features]
default = ["cli"]
# The `kep` binary only. Kept off the library's critical path so a consumer embedding
# this crate does not inherit an argument parser and a JSON serialiser it never calls.
cli = ["dep:clap", "dep:serde_json"]

[[bin]]
name = "kep"
required-features = ["cli"]

[dependencies]
blake3 = "1"
calamine = "0.34"
lingua = { version = "1", default-features = false, features = ["english", "french", "german", "spanish", "italian", "dutch", "portuguese"] }
mail-parser = "0.11"
pdf_oxide = "=0.3.78"
quick-xml = "0.42"
unicode-normalization = "0.1"
unicode-segmentation = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
# Non-optional here so the library's own tests can assert on serialised output even when
# the `cli` feature is off.
serde_json = "1"

[profile.release]
opt-level = 3
